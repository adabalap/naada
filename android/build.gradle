// Top-level build file. Classpath dependencies go here; module-level
// settings go in app/build.gradle.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.2.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
        // Chaquopy: the Python SDK that lets us bundle Flask + all pip
        // packages directly inside the APK.  No Python needed on the device.
        classpath "com.chaquo.python:gradle:15.0.1"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
