org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official

# Compile Kotlin in the Gradle process rather than a separate daemon.
# The daemon's compiler diagnostics do not reach Gradle's stdout, so a
# failure surfaces only as "CompilationErrorException: See log for more
# details" with the actual error message lost. Slightly slower; vastly
# more debuggable, which matters more in CI.
kotlin.compiler.execution.strategy=in-process
