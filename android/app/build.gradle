plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'  // embeds Python + pip packages in the APK
}

android {
    namespace 'com.adabala.naada'
    compileSdk 34

    defaultConfig {
        applicationId "com.adabala.naada"
        minSdk 26           // Android 8.0 — needed for foreground service
        targetSdk 34        //  improvements and notification channels
        versionCode 1
        versionName "1.0"

        // Chaquopy: which Python to embed.  3.11 is stable and fast.
        python {
            version "3.11"
            // Every package here is PURE PYTHON. That is deliberate:
            // Chaquopy can only install native extensions for which it
            // ships a prebuilt Android wheel, so a native dep like
            // `cryptography` fails the build with "no matching
            // distribution" unless the version happens to be one they
            // built. DES is implemented in pure_des.py instead.
            pip {
                install "flask==3.0.3"
                install "werkzeug==3.0.3"
                install "requests==2.32.3"
                install "urllib3==2.2.1"
                install "certifi"
                install "charset-normalizer"
                install "idna"
            }
        }

        // Build for both 32-bit and 64-bit ARM (covers all modern Android
        // phones) plus x86_64 for emulators.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        release {
            // The keystore is committed directly to the repo — no GitHub Secrets
            // needed. "Don't commit keystores" advice targets Play Store apps where
            // someone with your key could push malicious updates to millions of
            // users. For a personal sideloaded APK that never hits the Play Store,
            // the practical risk is near zero. The fingerprint is stable across
            // every build, so assetlinks.json keeps working and updates install
            // over previous versions without reinstalling.
            storeFile     file("naada-release.keystore")
            storePassword "naada2024"
            keyAlias      "naada"
            keyPassword   "naada2024"
        }
    }

    buildTypes {
        release {
            // Minification is deliberately OFF. R8 would need to be taught
            // about Chaquopy's Python runtime and the @JavascriptInterface
            // bridge; get that wrong and you get an APK that builds cleanly
            // then crashes at runtime. The size saving is negligible next to
            // a bundled CPython interpreter, so the trade is not worth it.
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // Core Android + Kotlin
    implementation 'androidx.core:core-ktx:1.12.0'
    // Coroutines: used by FlaskServerService and NaadaMediaService.
    // Was missing, which is a hard compile error.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Media3 / ExoPlayer — the audio engine.
    //
    // This replaces an earlier decision to leave ExoPlayer out on the
    // grounds that the WebView's <audio> element did the playing. That was
    // the root cause of "stops after 2-3 songs with the screen off": a
    // WebView belongs to the Activity, and Android freezes a backgrounded
    // Activity's media no matter how healthy a separate foreground service
    // is. Audio has to be produced by the service itself to survive, which
    // is exactly how Spotify and every other native player does it.
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-session:1.2.1'
    implementation 'androidx.media3:media3-common:1.2.1'
    implementation 'androidx.media:media:1.7.0'

    // WebView bridge extras
    implementation 'androidx.webkit:webkit:1.9.0'
}
