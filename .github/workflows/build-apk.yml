name: Build Naada APK

# Triggers:
#   - Every push to main (no path filter — simpler and more reliable)
#   - Manual trigger from Actions tab (the "Run workflow" button)
#   - On a schedule: every Sunday at midnight, so you always have a fresh
#     build even without pushing (optional, remove if not wanted)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual build (optional)'
        required: false
        default: 'Manual build'
  schedule:
    - cron: '0 0 * * 0'   # every Sunday midnight UTC

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform + build tools
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
          2>&1 | tail -5

      - name: Sync frontend assets
        run: |
          # If static/ exists at the repo root (full-repo layout), copy it
          # into the Android Python assets so it's bundled in the APK.
          # If not, the assets already bundled inside android/ are used.
          if [ -d "static" ]; then
            echo "Found static/ at repo root — syncing into Android assets"
            mkdir -p android/app/src/main/python/static
            cp -r static/. android/app/src/main/python/static/
            echo "Copied $(find static -type f | wc -l) files"
          elif [ -d "android/app/src/main/python/static" ]; then
            COUNT=$(find android/app/src/main/python/static -type f | wc -l)
            echo "Using pre-bundled assets ($COUNT files in android/app/src/main/python/static/)"
          else
            echo "ERROR: No frontend assets found. Add static/ to the repo root."
            exit 1
          fi

      - name: Set version
        id: version
        run: |
          CODE=$((1047 + ${{ github.run_number }}))
          NAME="1.0.${{ github.run_number }}"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          node -e "
            const fs = require('fs');
            let g = fs.readFileSync('android/app/build.gradle', 'utf8');
            g = g.replace(/versionCode \d+/, 'versionCode ' + $CODE);
            g = g.replace(/versionName \"[^\"]+\"/, 'versionName \"$NAME\"');
            fs.writeFileSync('android/app/build.gradle', g);
            console.log('Version set to $NAME / code $CODE');
          "

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tail -30

      - name: Locate APK
        run: |
          APK=$(find android -name "*release*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found. Build output:"
            find android -name "*.apk" 2>/dev/null || echo "No APKs at all"
            exit 1
          fi
          cp "$APK" "naada-${{ env.VERSION_NAME }}.apk"
          echo "APK: $(ls -lh naada-${{ env.VERSION_NAME }}.apk)"

      - name: Print SHA-256 fingerprint
        id: fp
        run: |
          FP=$(keytool -list -v \
            -keystore android/app/naada-release.keystore \
            -alias naada \
            -storepass naada2024 2>/dev/null \
            | grep "SHA256:" | head -1 \
            | sed 's/.*SHA256: //')
          echo "FINGERPRINT=$FP" >> "$GITHUB_ENV"
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Set on OCI to remove the address bar:"
          echo "  export NAADA_APK_FINGERPRINT=\"$FP\""
          echo "  ./naada.sh restart"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: naada-${{ env.VERSION_NAME }}
          path: naada-${{ env.VERSION_NAME }}.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Naada v${{ env.VERSION_NAME }}
          body: |
            Built from `${{ github.sha }}`
            ${{ github.event_name == 'workflow_dispatch' && format('Manual build: {0}', github.event.inputs.reason) || '' }}

            **Install**
            1. Download `naada-*.apk` below
            2. Phone: Settings → Apps → Special app access → Install unknown apps → allow
            3. Tap the APK to install *(uninstall any previous Naada first)*

            **Gemini AI key**
            Naada → Settings → AI & Config → paste key → Save → Test
            Free key: https://aistudio.google.com/app/apikey

            **Remove address bar** *(one-time OCI step)*
            ```bash
            export NAADA_APK_FINGERPRINT="${{ steps.fp.outputs.fingerprint }}"
            ./naada.sh restart
            ```
          files: naada-${{ env.VERSION_NAME }}.apk
